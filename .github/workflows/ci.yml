name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format / analyze / test / license
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teleprompter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          (cd apps/app && flutter pub get)
          for p in packages/*; do
            (cd "$p" && flutter pub get) || exit 1
          done
          # tool/ 下的评测工具也有独立 pubspec；缺包配置会让 dart format
          # 按最新语言版本排版，导致 format 步骤误报。
          (cd tool/eval && flutter pub get)
          (cd tool/eval_device && flutter pub get)

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: |
          (cd apps/app && dart analyze --fatal-infos --fatal-warnings .) || exit 1
          for p in packages/*; do
            (cd "$p" && dart analyze --fatal-infos --fatal-warnings .) || exit 1
          done

      - name: Import boundaries
        run: dart run tool/check_imports.dart

      - name: Test with coverage
        run: (cd apps/app && flutter test --coverage)

      - name: Coverage gate (70%)
        run: dart run tool/check_coverage.dart --min 70

      - name: License scan
        run: dart run tool/license_scan.dart
