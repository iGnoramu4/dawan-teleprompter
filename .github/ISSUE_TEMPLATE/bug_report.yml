name: Bug report
description: 报告可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并确认问题可以在最新内测包上复现。
        安全漏洞请按 [SECURITY.md](../../SECURITY.md) 私下报告，不要公开细节。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 一句话说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 导入…
        3. 开启语音跟随…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可附截图、日志或诊断包摘要；请先删除个人信息。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.25.0 (2028)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - macOS
        - Windows
        - 其他
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备 / 系统
      placeholder: 例如 Pixel 9 / Android 16；MacBook Air M2 / macOS 15.2
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 是否使用了语音跟随、悬浮窗、遥控、外接显示；是否可稳定复现。
    validations:
      required: false
