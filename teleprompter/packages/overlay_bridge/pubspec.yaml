name: overlay_bridge
description: "主引擎与悬浮窗引擎之间的 JSON 消息桥（仅 Android）。"
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dawan.teleprompter.overlay_bridge
        pluginClass: OverlayBridgePlugin
